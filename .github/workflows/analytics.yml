name: Calcular drift y actualizar dashboard
on:
  workflow_dispatch:
concurrency:
  group: pulso-transmi-analytics
  cancel-in-progress: false
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Sync published observations and calculate drift
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python src/ingest.py --persist
          python src/monitor.py --persist
      - name: Publish public aggregate snapshot
        run: |
          mkdir -p /tmp/pulso-dashboard-snapshot
          cp reports/dashboard.json /tmp/pulso-dashboard-snapshot/dashboard.json
          cd /tmp/pulso-dashboard-snapshot
          git init -b dashboard-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.json
          git commit -m 'Update drift and delivered forecast metrics'
          git -C "$GITHUB_WORKSPACE" fetch origin dashboard-data || true
          if git -C "$GITHUB_WORKSPACE" rev-parse --verify origin/dashboard-data >/dev/null 2>&1; then
            git fetch "$GITHUB_WORKSPACE" refs/remotes/origin/dashboard-data
            parent=$(git rev-parse FETCH_HEAD)
            tree=$(git rev-parse HEAD^{tree})
            commit=$(git commit-tree "$tree" -p "$parent" -m 'Update drift and delivered forecast metrics')
            git update-ref refs/heads/dashboard-data "$commit"
          fi
          git -C "$GITHUB_WORKSPACE" fetch /tmp/pulso-dashboard-snapshot dashboard-data
          git -C "$GITHUB_WORKSPACE" push origin FETCH_HEAD:refs/heads/dashboard-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report-${{ github.run_id }}
          path: reports/dashboard.json
          if-no-files-found: ignore
          retention-days: 14
